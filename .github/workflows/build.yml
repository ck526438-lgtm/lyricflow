name: Build LyricFlow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --org com.lyricflow --project-name lyricflow --platforms=android,ios .
      - name: Appliquer les réglages LyricFlow
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Icônes
        run: dart run flutter_launcher_icons
      - name: Compiler l'APK
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk LyricFlow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: LyricFlow.apk

  ios:
    name: IPA iOS (non signée)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet iOS
        run: flutter create --org com.lyricflow --project-name lyricflow --platforms=android,ios .
      - name: Appliquer les réglages LyricFlow
        run: python3 tool/patch_platforms.py
      - run: flutter pub get
      - name: Icônes
        run: dart run flutter_launcher_icons
      - name: Compiler l'app iOS
        run: flutter build ios --release --no-codesign
      - name: Emballer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr LyricFlow-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: LyricFlow-unsigned.ipa

  release:
    name: Publier la version
    needs: [android, ios]
    if: always() && github.event_name != 'pull_request' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LyricFlow v1.0.${{ github.run_number }}
          files: out/*
          body: |
            **Android** : télécharge `LyricFlow.apk` et installe-le (autorise les sources inconnues).
            **iPhone** : `LyricFlow-unsigned.ipa` s'installe avec AltStore ou Sideloadly (pas de signature Apple).
